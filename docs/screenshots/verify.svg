<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">TerraMig Verify screen</title>
  <desc id="desc">Illustrative TerraMig Verify screen showing Terraform validation, an import-only plan, and an explicit zero-drift gate.</desc>
  <defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#321653" flood-opacity=".12"/></filter><linearGradient id="purple" x1="0" x2="1"><stop stop-color="#6f3fb0"/><stop offset="1" stop-color="#8b4fc1"/></linearGradient></defs>
  <rect width="1200" height="700" fill="#f7f6f8"/><rect x="0" y="0" width="1200" height="70" fill="#fff"/>
  <rect x="28" y="19" width="34" height="34" rx="10" fill="url(#purple)"/><path d="M37 42c7-1 9-7 15-7 4 0 6 3 9 3" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <text x="75" y="44" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#21152a">TerraMig</text><text x="1040" y="42" font-family="Arial,sans-serif" font-size="14" fill="#6f3fb0" text-anchor="end">LOCAL TERRAFORM GATE</text>
  <text x="54" y="125" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#17131a">Validate and drift plan</text>
  <text x="54" y="156" font-family="Arial,sans-serif" font-size="16" fill="#625d68">Terraform validates the bundle locally before any Git delivery or HCP submission.</text>
  <rect x="54" y="193" width="1092" height="76" rx="12" fill="#e1f5ed" stroke="#99dbc4"/><circle cx="88" cy="231" r="15" fill="#1c9b75"/><path d="m80 231 6 6 11-14" fill="none" stroke="#fff" stroke-width="3"/><text x="120" y="226" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#176b55">Import-only plan · no drift detected</text><text x="120" y="249" font-family="Arial,sans-serif" font-size="14" fill="#3a7565">0 to add · 0 to change · 0 to destroy · 18 imports covered</text>
  <rect x="54" y="300" width="720" height="304" rx="12" fill="#211f24" filter="url(#shadow)"/><circle cx="84" cy="330" r="6" fill="#e15b6a"/><circle cx="104" cy="330" r="6" fill="#e8ad3a"/><circle cx="124" cy="330" r="6" fill="#36b58a"/><text x="148" y="336" font-family="monospace" font-size="14" font-weight="700" fill="#f2e8ff">TERRAFORM VALIDATION</text><g font-family="monospace" font-size="13" fill="#e7d9f8"><text x="82" y="379">$ terraform init -backend=false</text><text x="82" y="407">$ terraform validate -json</text><text x="82" y="435">$ terraform plan -refresh=true</text><text x="82" y="463">Plan: 0 to add, 0 to change, 0 to destroy</text><text x="82" y="491">$ terraform show -json adoption.tfplan</text></g><rect x="82" y="530" width="664" height="42" rx="8" fill="#302936"/><text x="102" y="556" font-family="Arial,sans-serif" font-size="13" fill="#c9b4dd">Diagnostics and plan evidence retained for review</text>
  <rect x="804" y="300" width="342" height="304" rx="12" fill="#fff" stroke="#ddd8e0" filter="url(#shadow)"/><text x="834" y="342" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#27212b">Safety gates</text><g font-family="Arial,sans-serif" font-size="14"><circle cx="837" cy="382" r="10" fill="#1c9b75"/><path d="m832 382 4 4 7-8" fill="none" stroke="#fff" stroke-width="2"/><text x="861" y="387" fill="#4b4650">Backend and provider pinned</text><circle cx="837" cy="429" r="10" fill="#1c9b75"/><path d="m832 429 4 4 7-8" fill="none" stroke="#fff" stroke-width="2"/><text x="861" y="434" fill="#4b4650">Every import ID deterministic</text><circle cx="837" cy="476" r="10" fill="#1c9b75"/><path d="m832 476 4 4 7-8" fill="none" stroke="#fff" stroke-width="2"/><text x="861" y="481" fill="#4b4650">No create / update / destroy</text><circle cx="837" cy="523" r="10" fill="#1c9b75"/><path d="m832 523 4 4 7-8" fill="none" stroke="#fff" stroke-width="2"/><text x="861" y="528" fill="#4b4650">Human review still required</text></g><rect x="834" y="554" width="282" height="28" rx="14" fill="#eee7f8"/><text x="975" y="573" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#6f3fb0">READY FOR GIT DELIVERY</text>
</svg>
