<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">TerraMig Discover screen</title>
  <desc id="desc">Illustrative TerraMig Discover screen showing grouped GCP resources, support badges, and a live inventory log.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#321653" flood-opacity=".12"/></filter>
    <linearGradient id="purple" x1="0" x2="1"><stop stop-color="#6f3fb0"/><stop offset="1" stop-color="#8b4fc1"/></linearGradient>
  </defs>
  <rect width="1200" height="700" fill="#f7f6f8"/>
  <rect x="0" y="0" width="1200" height="70" fill="#fff"/>
  <rect x="28" y="19" width="34" height="34" rx="10" fill="url(#purple)"/>
  <path d="M37 42c7-1 9-7 15-7 4 0 6 3 9 3" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <text x="75" y="44" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#21152a">TerraMig</text>
  <text x="1040" y="42" font-family="Arial,sans-serif" font-size="14" fill="#6f3fb0" text-anchor="end">INFRASTRUCTURE ADOPTION</text>
  <text x="54" y="125" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#17131a">Discover deployed resources</text>
  <text x="54" y="156" font-family="Arial,sans-serif" font-size="16" fill="#625d68">Cloud Asset Inventory results are grouped for fast review before anything is generated.</text>
  <rect x="54" y="193" width="1092" height="64" rx="12" fill="#eee7f8" stroke="#d4b7ec"/>
  <circle cx="84" cy="225" r="13" fill="#8b4fc1"/><path d="m78 225 5 5 9-11" fill="none" stroke="#fff" stroke-width="3"/>
  <text x="114" y="220" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#3c2752">528 supported resources</text>
  <text x="114" y="241" font-family="Arial,sans-serif" font-size="14" fill="#625d68">32 partial · 547 unknown · 228 unsupported · 1,335 normalized</text>
  <rect x="54" y="286" width="720" height="354" rx="12" fill="#fff" stroke="#ddd8e0" filter="url(#shadow)"/>
  <text x="82" y="325" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#17131a">Resources by service</text>
  <text x="82" y="349" font-family="Arial,sans-serif" font-size="13" fill="#77717d">Select a group to review its members and dependencies.</text>
  <g font-family="Arial,sans-serif">
    <rect x="82" y="376" width="664" height="65" rx="8" fill="#faf9fb" stroke="#e3dfe6"/>
    <rect x="101" y="394" width="30" height="30" rx="8" fill="#8b4fc1"/><text x="116" y="415" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">NET</text>
    <text x="149" y="402" font-size="15" font-weight="700" fill="#27212b">Compute Engine</text><text x="149" y="424" font-size="13" fill="#746d79">216 resources · 184 supported</text><text x="710" y="414" text-anchor="end" font-size="13" font-weight="700" fill="#6f3fb0">Select group →</text>
    <rect x="82" y="457" width="664" height="65" rx="8" fill="#faf9fb" stroke="#e3dfe6"/>
    <rect x="101" y="475" width="30" height="30" rx="8" fill="#8b4fc1"/><text x="116" y="496" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">DB</text>
    <text x="149" y="483" font-size="15" font-weight="700" fill="#27212b">Cloud SQL</text><text x="149" y="505" font-size="13" fill="#746d79">74 resources · 61 supported</text><text x="710" y="495" text-anchor="end" font-size="13" font-weight="700" fill="#6f3fb0">Select group →</text>
    <rect x="82" y="538" width="664" height="65" rx="8" fill="#faf9fb" stroke="#e3dfe6"/>
    <rect x="101" y="556" width="30" height="30" rx="8" fill="#8b4fc1"/><text x="116" y="577" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">OBJ</text>
    <text x="149" y="564" font-size="15" font-weight="700" fill="#27212b">Cloud Storage</text><text x="149" y="586" font-size="13" fill="#746d79">48 resources · 47 supported</text><text x="710" y="576" text-anchor="end" font-size="13" font-weight="700" fill="#6f3fb0">Select group →</text>
  </g>
  <rect x="804" y="286" width="342" height="354" rx="12" fill="#211f24" filter="url(#shadow)"/>
  <circle cx="831" cy="316" r="6" fill="#e15b6a"/><circle cx="851" cy="316" r="6" fill="#e8ad3a"/><circle cx="871" cy="316" r="6" fill="#36b58a"/>
  <text x="895" y="322" font-family="monospace" font-size="14" font-weight="700" fill="#f2e8ff">DISCOVERY SESSION</text>
  <g font-family="monospace" font-size="13" fill="#e7d9f8"><text x="828" y="365">$ Cloud Asset query started</text><text x="828" y="393">$ returned 1,757 assets</text><text x="828" y="421">$ filtered control-plane metadata</text><text x="828" y="449">$ normalized 1,335 resources</text><text x="828" y="477">$ dependency graph ready</text></g>
  <rect x="828" y="525" width="288" height="42" rx="8" fill="#302936"/><text x="848" y="551" font-family="Arial,sans-serif" font-size="13" fill="#c9b4dd">Read-only · no changes made</text>
</svg>
