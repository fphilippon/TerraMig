<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">TerraMig Match screen</title>
  <desc id="desc">Illustrative TerraMig Match screen showing a private module candidate, public registry fallback, and direct provider resource choice.</desc>
  <defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#321653" flood-opacity=".12"/></filter><linearGradient id="purple" x1="0" x2="1"><stop stop-color="#6f3fb0"/><stop offset="1" stop-color="#8b4fc1"/></linearGradient></defs>
  <rect width="1200" height="700" fill="#f7f6f8"/><rect x="0" y="0" width="1200" height="70" fill="#fff"/>
  <rect x="28" y="19" width="34" height="34" rx="10" fill="url(#purple)"/><path d="M37 42c7-1 9-7 15-7 4 0 6 3 9 3" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <text x="75" y="44" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#21152a">TerraMig</text><text x="1040" y="42" font-family="Arial,sans-serif" font-size="14" fill="#6f3fb0" text-anchor="end">MATCH MODULES</text>
  <text x="54" y="125" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#17131a">Choose the Terraform representation</text>
  <text x="54" y="156" font-family="Arial,sans-serif" font-size="16" fill="#625d68">Private modules are preferred; public modules and direct provider resources remain explicit fallbacks.</text>
  <rect x="54" y="193" width="1092" height="58" rx="12" fill="#fff" stroke="#ddd8e0"/><text x="82" y="228" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#6f3fb0">AUTOMATIC POLICY</text><text x="236" y="228" font-family="Arial,sans-serif" font-size="14" fill="#625d68">Latest compatible private module selected by group</text><rect x="1015" y="211" width="98" height="24" rx="12" fill="#e1f5ed"/><text x="1064" y="228" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#14785e">ENABLED</text>
  <rect x="54" y="280" width="1092" height="360" rx="12" fill="#fff" stroke="#ddd8e0" filter="url(#shadow)"/>
  <rect x="84" y="310" width="44" height="44" rx="8" fill="#8b4fc1"/><text x="106" y="338" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#fff">OBJ</text><text x="149" y="331" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#27212b">gfr-cc-d-903755-netlb-1067-ip</text><text x="149" y="353" font-family="Arial,sans-serif" font-size="13" fill="#746d79">compute.googleapis.com/Address · 2 dependencies</text>
