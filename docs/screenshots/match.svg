    <rect x="84" y="380" width="1032" height="62" rx="8" fill="#eee7f8" stroke="#8b4fc1" stroke-width="2"/><circle cx="111" cy="411" r="10" fill="#8b4fc1"/><circle cx="111" cy="411" r="4" fill="#fff"/><text x="140" y="406" font-size="15" font-weight="700" fill="#342042">app.terraform.io/customer/terraform-google-loadbalancer/gcp</text><text x="140" y="427" font-size="13" fill="#746d79">v0.3.1 · 94% match · HCP private library · 25 managed resources</text><rect x="1006" y="398" width="92" height="26" rx="13" fill="#f5d994"/><text x="1052" y="416" text-anchor="middle" font-size="12" font-weight="700" fill="#704d00">PRIVATE</text>
