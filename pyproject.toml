[project]
name = "terramig"
version = "0.1.0"
description = "AI-assisted adoption of existing GCP infrastructure into HCP Terraform"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "cryptography==50.0.0",
  "psycopg[binary]==3.3.4",
]

[tool.setuptools.package-data]
terramig = ["data/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
