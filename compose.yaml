services:
  postgres:
    image: postgres:17.10-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: terramig
      POSTGRES_USER: terramig
      POSTGRES_PASSWORD: ${TERRAMIG_POSTGRES_PASSWORD:-terramig}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terramig -d terramig"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - terramig-postgres:/var/lib/postgresql/data

  terramig:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TERRAMIG_DATABASE_HOST: postgres
      TERRAMIG_DATABASE_PORT: "5432"
      TERRAMIG_DATABASE_NAME: terramig
      TERRAMIG_DATABASE_USER: terramig
      TERRAMIG_DATABASE_PASSWORD: ${TERRAMIG_POSTGRES_PASSWORD:-terramig}
      TERRAMIG_REQUIRE_POSTGRES: "true"
      TERRAMIG_ADMIN_USERNAME: ${TERRAMIG_ADMIN_USERNAME:-admin}
      TERRAMIG_ADMIN_PASSWORD: ${TERRAMIG_ADMIN_PASSWORD:-admin}
      TERRAMIG_SECURE_COOKIES: ${TERRAMIG_SECURE_COOKIES:-false}
      TERRAMIG_HCP_HOSTNAME: ${TERRAMIG_HCP_HOSTNAME:-app.terraform.io}
      TERRAMIG_HCP_ORGANIZATION: ${TERRAMIG_HCP_ORGANIZATION:-}
      TERRAMIG_HCP_WORKSPACE: ${TERRAMIG_HCP_WORKSPACE:-}
      TERRAMIG_HCP_TOKEN: ${TERRAMIG_HCP_TOKEN:-}
      TERRAMIG_GCP_PROJECT_ID: ${TERRAMIG_GCP_PROJECT_ID:-}
      TERRAMIG_GCP_CREDENTIALS_JSON: ${TERRAMIG_GCP_CREDENTIALS_JSON:-}
      TERRAMIG_GCP_DISCOVERY_TIMEOUT_SECONDS: ${TERRAMIG_GCP_DISCOVERY_TIMEOUT_SECONDS:-600}
      TERRAMIG_AI_PROVIDER: ${TERRAMIG_AI_PROVIDER:-github-copilot}
      TERRAMIG_AI_BATCH_SIZE: ${TERRAMIG_AI_BATCH_SIZE:-20}
      TERRAMIG_AI_MAX_BATCH_PROMPT_BYTES: ${TERRAMIG_AI_MAX_BATCH_PROMPT_BYTES:-120000}
      TERRAMIG_AI_BATCH_PROCESS_ATTEMPTS: ${TERRAMIG_AI_BATCH_PROCESS_ATTEMPTS:-2}
      TERRAMIG_SECRET_ENCRYPTION_KEY: ${TERRAMIG_SECRET_ENCRYPTION_KEY:-}
      COPILOT_GITHUB_TOKEN: ${COPILOT_GITHUB_TOKEN:-}
      BOBSHELL_API_KEY: ${BOBSHELL_API_KEY:-}
      TERRAMIG_ENABLE_HCP_SUBMISSION: ${TERRAMIG_ENABLE_HCP_SUBMISSION:-true}
      TERRAMIG_GITHUB_TOKEN: ${TERRAMIG_GITHUB_TOKEN:-}
      TERRAMIG_GIT_SSH_PRIVATE_KEY: ${TERRAMIG_GIT_SSH_PRIVATE_KEY:-}
      TERRAMIG_GIT_KNOWN_HOSTS: ${TERRAMIG_GIT_KNOWN_HOSTS:-}
      TERRAMIG_GIT_KNOWN_HOSTS_FILE: ${TERRAMIG_GIT_KNOWN_HOSTS_FILE:-}
      TERRAMIG_GIT_ALLOWED_HOSTS: ${TERRAMIG_GIT_ALLOWED_HOSTS:-github.com}
      TERRAMIG_GIT_AUTHOR_NAME: ${TERRAMIG_GIT_AUTHOR_NAME:-TerraMig}
      TERRAMIG_GIT_AUTHOR_EMAIL: ${TERRAMIG_GIT_AUTHOR_EMAIL:-terramig@localhost}
      TERRAMIG_WORKER_ENABLED: "true"
      TERRAMIG_HCP_POLL_SECONDS: ${TERRAMIG_HCP_POLL_SECONDS:-10}
    ports:
      - "${TERRAMIG_PORT:-8080}:8080"
    volumes:
      - terramig-runtime:/app/.terramig

volumes:
  terramig-postgres:
  terramig-runtime:
