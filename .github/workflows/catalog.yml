name: Private module catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TERRAMIG_HCP_TOKEN: ${{ secrets.TERRAMIG_HCP_TOKEN }}
      TERRAMIG_CATALOG_SIGNING_KEY: ${{ secrets.TERRAMIG_CATALOG_SIGNING_KEY }}
      TERRAMIG_HCP_ORGANIZATION: ${{ vars.TERRAMIG_HCP_ORGANIZATION }}
      TERRAMIG_HCP_HOSTNAME: ${{ vars.TERRAMIG_HCP_HOSTNAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false
      - name: Build signed catalog
        id: build_catalog
        continue-on-error: true
        run: |
          test -n "$TERRAMIG_HCP_TOKEN"
          test -n "$TERRAMIG_CATALOG_SIGNING_KEY"
          test -n "$TERRAMIG_HCP_ORGANIZATION"
          hostname="${TERRAMIG_HCP_HOSTNAME:-app.terraform.io}"
          PYTHONPATH=src python scripts/build_module_catalog.py \
            --hostname "$hostname" \
            --organization "$TERRAMIG_HCP_ORGANIZATION" \
            --output dist/private-modules.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: terramig-private-module-catalog
          path: dist/private-modules.json
          if-no-files-found: error
      - name: Enforce successful catalog build
        if: steps.build_catalog.outcome == 'failure'
        run: exit 1
