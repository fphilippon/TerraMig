name: Private module catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TERRAMIG_HCP_TOKEN: ${{ secrets.TERRAMIG_HCP_TOKEN }}
      TERRAMIG_CATALOG_SIGNING_KEY: ${{ secrets.TERRAMIG_CATALOG_SIGNING_KEY }}
      TERRAMIG_HCP_ORGANIZATION: ${{ vars.TERRAMIG_HCP_ORGANIZATION }}
      TERRAMIG_HCP_HOSTNAME: ${{ vars.TERRAMIG_HCP_HOSTNAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false
      - name: Check catalog configuration
        id: configuration
        run: |
          missing=""
          [ -n "$TERRAMIG_HCP_TOKEN" ] || missing="$missing TERRAMIG_HCP_TOKEN"
          [ -n "$TERRAMIG_CATALOG_SIGNING_KEY" ] || missing="$missing TERRAMIG_CATALOG_SIGNING_KEY"
          [ -n "$TERRAMIG_HCP_ORGANIZATION" ] || missing="$missing TERRAMIG_HCP_ORGANIZATION"
          if [ -z "$missing" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::error::Missing catalog configuration:$missing. Configure the repository secrets/variable before running this workflow manually."
            exit 1
          fi
          echo "::warning::Skipping scheduled catalog build; missing configuration:$missing. Configure the repository secrets/variable to publish the catalog."
          echo "configured=false" >> "$GITHUB_OUTPUT"
      - name: Build signed catalog
        id: build_catalog
        if: steps.configuration.outputs.configured == 'true'
        run: |
          hostname="${TERRAMIG_HCP_HOSTNAME:-app.terraform.io}"
          PYTHONPATH=src python scripts/build_module_catalog.py \
            --hostname "$hostname" \
            --organization "$TERRAMIG_HCP_ORGANIZATION" \
            --output dist/private-modules.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.configuration.outputs.configured == 'true'
        with:
          name: terramig-private-module-catalog
          path: dist/private-modules.json
          if-no-files-found: error
      - name: Report scheduled catalog skip
        if: steps.configuration.outputs.configured != 'true' && github.event_name != 'workflow_dispatch'
        run: echo "Catalog build skipped because HCP registry configuration is not present."
