name: Supply chain

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "43 3 * * 3"

permissions:
  contents: read

jobs:
  python-dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Audit pinned runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check "pip-audit==2.10.1"
          python -m pip_audit --requirement requirements.txt

  dependency-review:
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.repository.visibility == 'public' ||
       vars.ENABLE_DEPENDENCY_REVIEW == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate

  image-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build --tag terramig:supply-chain .
      - name: Scan image
        id: image_scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: terramig:supply-chain
          format: json
          output: trivy-report.json
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore.yaml
      - name: Upload vulnerability report
        if: always() && steps.image_scan.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: terramig-vulnerability-report
          path: trivy-report.json
          if-no-files-found: ignore
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          image: terramig:supply-chain
          format: spdx-json
          output-file: terramig.spdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: terramig-sbom
          path: terramig.spdx.json
          if-no-files-found: error
