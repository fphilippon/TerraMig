name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned runtime dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          --only-binary=:all: --requirement requirements.txt
      - name: Compile
        run: PYTHONPATH=src python -m compileall -q src tests scripts
      - name: Unit and contract tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Validate data catalogs
        run: |
          python -m json.tool src/terramig/data/google_provider_7_39_0_capabilities.json >/dev/null
          python -m json.tool fixtures/private_registry.json >/dev/null
          PYTHONPATH=src python scripts/build_module_catalog.py --help >/dev/null

  container:
    runs-on: ubuntu-latest
    env:
      TERRAMIG_ADMIN_USERNAME: ci-admin
      TERRAMIG_ADMIN_PASSWORD: CI-Bootstrap-Password-2026!
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and start PostgreSQL deployment
        run: |
          mkdir -p tmp
          docker compose up --detach --build
      - name: Verify runtime tools, authentication, and persistence
        run: |
          trap 'docker compose down --volumes' EXIT
          for attempt in $(seq 1 20); do
            curl --fail --silent http://127.0.0.1:8080/api/health && break
            if [ "$attempt" = 20 ]; then docker compose logs; exit 1; fi
            sleep 2
          done
          readiness_status="$(curl --silent --output /tmp/readiness.json \
            --write-out '%{http_code}' http://127.0.0.1:8080/api/health/ready)"
          test "$readiness_status" = 503
          jq -e '.status == "not-ready"' /tmp/readiness.json
          login_status="$(curl --silent --output /tmp/login.json \
            --write-out '%{http_code}' --cookie-jar /tmp/terramig-cookies \
            --header 'Content-Type: application/json' \
            --data '{"username":"ci-admin","password":"CI-Bootstrap-Password-2026!"}' \
            http://127.0.0.1:8080/api/auth/login)"
          if [ "$login_status" != 200 ]; then
            cat /tmp/login.json
            docker compose logs terramig
            exit 1
          fi
          curl --fail --silent --cookie /tmp/terramig-cookies \
            http://127.0.0.1:8080/api/auth/session \
            | jq -e '.user.username == "ci-admin" and .persistence.durable == true'
          docker compose restart terramig
          for attempt in $(seq 1 20); do
            curl --fail --silent http://127.0.0.1:8080/api/health && break
            if [ "$attempt" = 20 ]; then docker compose logs terramig; exit 1; fi
            sleep 2
          done
          curl --fail --silent --cookie /tmp/terramig-cookies \
            http://127.0.0.1:8080/api/auth/session \
            | jq -e '.user.username == "ci-admin" and .persistence.durable == true'
          docker compose exec --no-TTY terramig terraform version
          docker compose exec --no-TTY terramig terraform-mcp-server --version
          docker compose exec --no-TTY terramig copilot --version
          docker compose exec --no-TTY terramig bob --version
          docker compose exec --no-TTY terramig gcloud version
